[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratorio-extraccion-llm"
version = "0.1.0"
description = "Laboratorio de extracción estructurada de texto con temas en Markdown"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Proyecto de ejemplo" }]
dependencies = [
  "langchain>=1.0,<3.0",
  "langchain-core>=1.0,<3.0",
  "langchain-groq>=1.0,<3.0",
  "pydantic>=2.6,<3.0",
  "jsonschema>=4.22,<5.0",
  "referencing>=0.28,<1.0",
  "python-dotenv>=1.0,<2.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<3.0"]
anthropic = ["langchain-anthropic>=1.0,<3.0"]
ollama = ["langchain-ollama>=1.0,<3.0", "httpx>=0.27,<1.0"]
all = ["langchain-openai>=1.0,<3.0", "langchain-anthropic>=1.0,<3.0", "langchain-ollama>=1.0,<3.0", "httpx>=0.27,<1.0"]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
extraer-llm = "extraccion_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
